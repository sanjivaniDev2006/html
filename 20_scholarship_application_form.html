<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Application Form</title>
</head>
<body>
    <h1>Scholarship Application Form</h1>
    <form>
        <label for="#" > Student Name:</label>
        <input type="text" placeholder="First name">
        <input type="text" placeholder="Last name"><br><br>

        <label for="#"> Date Of Birth:</label>
        <input type="date" name="#" id="#"
        placeholder="Enter your date of birth"><br><br>

        <label >Gender:</label>
        <select name="#" id="#">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br><br>
        <label for="#"> Email Address:</label>
        <input type="Email" name="#" id="#"
        placeholder="Enter your email"><br><br>

        <label for="#">Mailing Address:</label>
        <input type="text" name="#" id="#"
        placeholder="Street address"><br><br>
        <input type="text" name="#" id="#"
         placeholder="street address line 2"><br><br>
         <input type="text" name="#" id="#"
         placeholder="city">
         <input type="text" name="#" id="#"
         placeholder="state"><br><br>
         <input type="text" name="#" id="#"
            placeholder="postal / zip code">
        <select name="#" id="#">
            <option value="usa">Romania</option>
            <option value="canada">India</option>
            <option value="uk">United Kingdom</option>
        </select><br><br>
        <label for="#" >What is your current study status:</label>
        <select name="#" id="#">
            <option value="">-</option>
            <option value="highschool">High School Student</option>
            <option value="undergraduate">Undergraduate Student</option>
            <option value="graduate">Graduate Student</option>
            <option value="other">Other</option>
        </select><br><br>

        <input type="submit" value="submit">
        <input type="reset" value="reset">

    </form>
</body>
</html>
