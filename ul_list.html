<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered list</title>
</head>
<body>
    <ul type="square">
        <li>Dairy milk</li>
        <li>Kitkat</li>
        <li>Perk</li>
        <li>Milkybar</li>
        <li>5 Star</li>
    </ul>
    <br>

     <ul type="circle">
        <li>Dairy milk</li>
        <li>Kitkat</li>
        <li>Perk</li>
        <li>Milkybar</li>
        <li>5 Star</li>
    </ul>
    <br>

        <ul type="disc">
            <li>Dairy milk</li>
            <li>Kitkat</li>
            <li>Perk</li>
            <li>Milkybar</li>
            <li>5 Star</li>
</body>
</html>
